name: Quality Assurance Workflow
on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  qa:
    name: Quality Assurance Check
    runs-on: ubuntu-latest
    container: node:24-alpine
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js packages
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lintcheck
        run: pnpm check:ci
